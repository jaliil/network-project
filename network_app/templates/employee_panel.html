{% extends 'base.html' %}

{% block content %}
<style>
    /* ========================================================
       ?. ?????? ???? ???? ????
       ======================================================== */
    header, nav, aside, .sidebar, .main-sidebar, .navbar, .main-header, #sidebar, #header, .topbar { display: none !important; }
    body, main, #main, .content-wrapper, .main-content, #content, .container-fluid { 
        margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important;
        background-color: #0f172a !important; height: 100vh !important; overflow: hidden !important;
    }

    /* ========================================================
       ?. ???? ????? ??? ???????
       ======================================================== */
    .unified-toolbar {
        background: #1e293b; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding: 6px 20px; display: flex; align-items: center; justify-content: space-between;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); height: 55px;
    }
    
    .toolbar-group { display: flex; align-items: center; gap: 10px; }
    .divider { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.08); margin: 0 5px; }

    /* ========================================================
       ?. ???? ????? ???? ????????
       ======================================================== */
    .select-wrapper {
        position: relative;
        height: 32px;
        display: flex;
        align-items: center;
        width: 170px;
    }
    .select-wrapper i.bi-geo-alt-fill {
        position: absolute;
        left: 10px;
        color: #3b82f6;
        font-size: 0.9rem;
        pointer-events: none;
    }
    .custom-select {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        background-color: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f8fafc;
        padding: 0 10px 0 30px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        height: 100%;
        transition: all 0.2s ease;
    }
    .custom-select:focus {
        border-color: #3b82f6; outline: none;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }
    .custom-select option { background: #1e293b; color: #f8fafc; }

    /* ========================================================
       ????? ????/?????? ? ???? ??????
       ======================================================== */
    .device-toggle {
        display: flex; background: rgba(0, 0, 0, 0.2); border-radius: 6px; height: 32px;
        overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .device-toggle input[type="radio"] { display: none; }
    .device-toggle label {
        padding: 0 12px; color: #94a3b8; font-size: 0.85rem; cursor: pointer;
        transition: all 0.3s; margin: 0; font-weight: 500; display: flex; align-items: center; gap: 4px;
    }
    .device-toggle input[type="radio"]:checked + label {
        background: #3b82f6; color: white; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .ip-input { 
        background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; height: 32px;
        padding: 0 12px; border-radius: 6px; outline: none; width: 170px; 
        font-family: monospace; font-size: 0.9rem; transition: all 0.2s;
    }
    .ip-input:focus { border-color: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15); }
    
    .btn-connect { 
        background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; height: 32px;
        padding: 0 20px; border-radius: 6px; font-weight: 500; font-size: 0.85rem; display: flex; align-items: center; gap: 5px;
        cursor: pointer; transition: all 0.2s ease; white-space: nowrap; box-shadow: 0 3px 8px rgba(16, 185, 129, 0.2);
    }
    .btn-connect:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

    .action-btn {
        padding: 4px 12px; border-radius: 5px; font-size: 0.8rem; font-weight: 500; height: 32px;
        cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s ease; white-space: nowrap; text-decoration: none;
    }
    .btn-disconnect { background: rgba(239, 68, 68, 0.05); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.15); display: none; }
    .btn-disconnect:hover { background: #ef4444; color: white; border-color: #ef4444; }
    .btn-exit { background: rgba(255, 255, 255, 0.03); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.08); }
    .btn-exit:hover { background: #334155; color: white; border-color: #475569; }

    .user-badge {
        color: #cbd5e1; font-size: 0.75rem; display: flex; align-items: center; gap: 5px; height: 32px;
        background: rgba(255, 255, 255, 0.03); padding: 0 10px; border-radius: 12px; transition: all 0.2s ease;
    }
    .user-badge:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

    .frame-wrapper { width: 100%; height: calc(100vh - 55px); display: none; background: #0f172a; }
    .device-frame { width: 100%; height: 100%; border: none; background: #fff; }
    .empty-state { height: calc(100vh - 55px); display: flex; flex-direction: column; justify-content: center; align-items: center; }
</style>

<!-- ???? ????? -->
<div class="unified-toolbar">
    <div class="toolbar-group">
        <div class="select-wrapper">
            <i class="bi bi-geo-alt-fill"></i>
            <select id="province_select" class="custom-select" title="Select Province">
                <option value="" disabled selected>Select Province...</option>
                {% for prov in provinces %}
                    <option value="{{ prov.id }}">{{ prov.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="device-toggle">
            <input type="radio" id="type-sender" name="device_type" value="sender" checked>
            <label for="type-sender" title="Sender Device"><i class="bi bi-wifi"></i> Sender</label>

            <input type="radio" id="type-receiver" name="device_type" value="receiver">
            <label for="type-receiver" title="Receiver Device"><i class="bi bi-hdd-network"></i> Receiver</label>
        </div>

        <form id="connection-form" onsubmit="loadDeviceInFrame(event)" class="d-flex align-items-center gap-2 m-0">
            <input type="text" id="device_ip" class="ip-input" placeholder="IP Address..." required autofocus autocomplete="off">
            <button type="submit" class="btn-connect" id="connect-btn"><i class="bi bi-rocket-takeoff-fill"></i> Connect</button>
        </form>
    </div>

    <div class="toolbar-group">
        <button type="button" id="close-btn" class="action-btn btn-disconnect" onclick="closeDevice()" title="Disconnect from Device">
            <i class="bi bi-plug"></i> Disconnect
        </button>

        <div class="divider" id="right-divider" style="display: none;"></div>
        
        <a href="{% url 'update_profile' %}" class="user-badge mx-1" style="text-decoration: none; cursor: pointer; border: 1px solid rgba(255,255,255,0.05);" title="Update Your Passwords">
            <i class="bi bi-shield-lock-fill"></i> 
            <strong class="text-primary text-uppercase">{{ request.user.username|default:"SERVER" }}</strong>
        </a>

        <form action="{% url 'logout' %}" method="post" style="margin: 0; padding: 0; display: flex;">
            {% csrf_token %}
            <button type="submit" class="action-btn btn-exit" title="Logout of System">
                <i class="bi bi-box-arrow-right"></i> Exit
            </button>
        </form>
    </div>
</div>

<!-- ???? ????? ?? ??? -->
<div id="empty-state" class="empty-state">
    <div style="background: rgba(255,255,255,0.02); padding: 30px; border-radius: 16px; text-align: center; border: 1px dashed rgba(255,255,255,0.05);">
        <i class="bi bi-hdd-network text-secondary" style="font-size: 3.5rem; opacity: 0.4;"></i>
        <h5 class="text-light mt-3" style="font-weight: 300; letter-spacing: 1px;">Ready for Connection</h5>
        <p class="text-muted small mt-2 m-0">Select a province, enter IP and hit Enter</p>
    </div>
</div>

<div id="frame-wrapper" class="frame-wrapper">
    <iframe id="device_frame" class="device-frame" src=""></iframe>
</div>

<script>
    const credsData = {{ user_creds_json|safe }};

    document.getElementById('device_ip').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); 
            loadDeviceInFrame(event); 
        }
    });

    function forceCopyText(text) {
        if (!text) return false;
        const tempInput = document.createElement("textarea");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        let success = false;
        try { success = document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(tempInput);
        return success;
    }

    function loadDeviceInFrame(event) {
        if (event) event.preventDefault(); 
        
        const ipAddress = document.getElementById('device_ip').value.trim();
        const provinceSelect = document.getElementById('province_select');
        const selectedProvId = provinceSelect.value;

        // ???? ?????? ?? ???? ???? ???? ???
        if (!ipAddress || !selectedProvId) return;

        const isSender = document.getElementById('type-sender').checked;
        let passValue = "";
        
        if (credsData[selectedProvId]) {
            passValue = isSender ? credsData[selectedProvId].s_pass : credsData[selectedProvId].r_pass;
        }

        let targetUrl = ipAddress;
        if (!/^https?:\/\//i.test(ipAddress)) { targetUrl = 'http://' + ipAddress; }

        // ??? ?????? ??????
        if (passValue) {
            forceCopyText(passValue);
        }

        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('frame-wrapper').style.display = 'block';
        
        document.getElementById('close-btn').style.display = 'flex';
        document.getElementById('right-divider').style.display = 'block';
        
        document.getElementById('device_frame').src = targetUrl;
    }

    function closeDevice() {
        document.getElementById('device_frame').src = '';
        document.getElementById('frame-wrapper').style.display = 'none';
        document.getElementById('empty-state').style.display = 'flex'; 
        document.getElementById('close-btn').style.display = 'none';
        document.getElementById('right-divider').style.display = 'none';
        
        const ipInput = document.getElementById('device_ip');
        ipInput.value = '';
        ipInput.focus(); 
    }
</script>
{% endblock %}
