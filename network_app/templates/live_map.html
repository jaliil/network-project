{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- اضافه کردن فایل‌های کتابخانه Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    /* تنظیمات استایل برای نقشه */
    #map {
        height: 75vh; 
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        z-index: 1; /* جلوگیری از تداخل با منوها */
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* استایل پاپ‌آپ‌های روی نقشه */
    .leaflet-popup-content-wrapper {
        background: #1e293b;
        color: #f8fafc;
        border-radius: 8px;
        border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .leaflet-popup-tip {
        background: #1e293b;
    }
    
    .map-header {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 15px 20px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .legend-item { display: flex; align-items: center; gap: 8px; margin-left: 15px; font-size: 0.85rem; font-weight: 500; color: #cbd5e1; }
    .legend-color { width: 12px; height: 12px; border-radius: 50%; }
</style>

<div class="map-header shadow-sm">
    <h5 class="m-0 fw-bold text-primary"><i class="bi bi-globe-americas me-2"></i>Live Network Map</h5>
    <div class="d-flex align-items-center">
        <div class="legend-item"><div class="legend-color" style="background: #10b981;"></div> Normal (< 50%)</div>
        <div class="legend-item"><div class="legend-color" style="background: #f59e0b;"></div> Warning (50-80%)</div>
        <div class="legend-item"><div class="legend-color" style="background: #ef4444; box-shadow: 0 0 8px #ef4444;"></div> Critical (> 80%)</div>
    </div>
</div>

<!-- کانتینر اصلی نقشه -->
<div id="map"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // ۱. مقداردهی اولیه نقشه (استفاده از تم دارک)
        var map = L.map('map').setView([34.52813, 69.17233], 6); // مرکز دیفالت روی کابل

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a>',
            maxZoom: 18
        }).addTo(map);

        // برای تنظیم خودکار زوم نقشه تا همه دکل‌ها دیده شوند
        var bounds = [];

        // ==========================================
        // ۲. رسم دکل‌ها (پین‌ها) روی نقشه
        // ==========================================
        const btsData = [
            {% for bts in bts_list %}
            {
                name: "{{ bts.name|escapejs }}",
                prov: "{{ bts.province.name|escapejs }}",
                lat: parseFloat("{{ bts.latitude|default:'0' }}"), // حل مشکل NaN
                lng: parseFloat("{{ bts.longitude|default:'0' }}")
            },
            {% endfor %}
        ];

        // آیکون کاستوم برای دکل‌ها (شبیه آنتن)
        var btsIcon = L.divIcon({
            html: '<div style="background: #3b82f6; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #1e293b; box-shadow: 0 0 10px #3b82f6;"></div>',
            className: '',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
        });

        btsData.forEach(function(bts) {
            if (bts.lat !== 0 && bts.lng !== 0) {
                var marker = L.marker([bts.lat, bts.lng], {icon: btsIcon}).addTo(map);
                marker.bindPopup(`<b>${bts.name}</b><br><small class="text-muted">Province: ${bts.prov}</small>`);
                bounds.push([bts.lat, bts.lng]);
            }
        });

        // ==========================================
        // ۳. رسم خطوط ارتباطی و محاسبه ترافیک زنده
        // ==========================================
        const linksData = [
            {% for link in links %}
            {
                sourceName: "{{ link.source_bts.name|escapejs }}",
                targetName: "{{ link.target_bts.name|escapejs }}",
                sourceLat: parseFloat("{{ link.source_bts.latitude|default:'0' }}"),
                sourceLng: parseFloat("{{ link.source_bts.longitude|default:'0' }}"),
                targetLat: parseFloat("{{ link.target_bts.latitude|default:'0' }}"),
                targetLng: parseFloat("{{ link.target_bts.longitude|default:'0' }}"),
                type: "{{ link.link_type }}",
                capacity: parseInt("{{ link.capacity_mbps|default:'1000' }}"),
                tx: parseFloat("{{ link.current_tx_mbps|default:'0' }}"),
                rx: parseFloat("{{ link.current_rx_mbps|default:'0' }}")
            },
            {% endfor %}
        ];

        linksData.forEach(function(link) {
            if (link.sourceLat !== 0 && link.targetLat !== 0) {
                
                // محاسبه درصد پر بودن لینک بر اساس بالاترین ترافیک (TX یا RX)
                let maxTraffic = Math.max(link.tx, link.rx);
                let percent = (maxTraffic / link.capacity) * 100;

                // تعیین رنگ و ضخامت خط بر اساس ترافیک
                let lineColor = '#10b981'; // سبز
                let weight = 3;

                if (percent >= 80) {
                    lineColor = '#ef4444'; // قرمز
                    weight = 5; // ضخیم‌تر برای بحرانی
                } else if (percent >= 50) {
                    lineColor = '#f59e0b'; // نارنجی
                    weight = 4;
                }

                // استایل خط (وایرلس = خط‌چین ، فیبر = ممتد)
                let dashArray = (link.type === 'wireless') ? '8, 10' : null;

                // رسم خط روی نقشه
                let latlngs = [
                    [link.sourceLat, link.sourceLng],
                    [link.targetLat, link.targetLng]
                ];

                let polyline = L.polyline(latlngs, {
                    color: lineColor,
                    weight: weight,
                    dashArray: dashArray,
                    opacity: 0.8
                }).addTo(map);

                // پنجره راهنما با نگه داشتن موس روی خط (ترافیک لحظه‌ای)
                let tooltipContent = `
                    <div style="text-align: center; font-size: 0.9rem;">
                        <strong class="text-warning">${link.sourceName} ↔ ${link.targetName}</strong><br>
                        <hr style="margin: 5px 0; border-color: rgba(255,255,255,0.2);">
                        <span style="color: #94a3b8;">Type:</span> ${link.type.toUpperCase()}<br>
                        <span style="color: #94a3b8;">Capacity:</span> ${link.capacity} Mbps<br>
                        <span style="color: #94a3b8;">Traffic:</span> 
                        <span class="text-success"><i class="bi bi-arrow-up"></i> ${link.tx.toFixed(1)}M</span> / 
                        <span class="text-info"><i class="bi bi-arrow-down"></i> ${link.rx.toFixed(1)}M</span><br>
                        <div style="margin-top: 5px; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 4px;">
                            Utilization: <strong>${percent.toFixed(1)}%</strong>
                        </div>
                    </div>
                `;
                polyline.bindTooltip(tooltipContent, {sticky: true});
            }
        });

        // اگر دکلی روی نقشه بود، نقشه را طوری زوم کن که همه دیده شوند
        if (bounds.length > 0) {
            map.fitBounds(bounds, {padding: [50, 50]});
        }
    });
</script>
{% endblock %}
